name: Build, Lint, and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  # 'lts/*' always resolves to the latest Node.js LTS on the runner.
  NODE_VERSION: 'lts/*'

jobs:
  test:
    name: Lint and Test Build
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Check formatting
        run: npm run check
        continue-on-error: true

      - name: Test build (compile + pack only)
        run: npm run pack

  build:
    name: Build & Publish macOS (Intel + Apple Silicon)
    runs-on: macos-latest
    needs: test
    # Runs on a version tag push (v*) or when triggered manually from any branch.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      # Uses the token GitHub provides automatically — no personal token needed
      # to publish releases to this same repository.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Set app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Setting app version to ${{ github.ref_name }}"
          npm version ${{ github.ref_name }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Package & publish (x64 + arm64)
        run: npx electron-builder --mac --x64 --arm64 --publish always

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quicktoss-mac
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.yml
          retention-days: 30
          if-no-files-found: ignore
